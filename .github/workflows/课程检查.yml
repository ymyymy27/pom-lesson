name: 课程检查
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r "04-项目实践/01-TaskFlow校园任务助手/第四版-Django网页应用/requirements.txt"
      - run: python "工具脚本/验证课程.py" --django-python python
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 02-方向选修/04-Flutter移动应用开发/起步工程
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web
