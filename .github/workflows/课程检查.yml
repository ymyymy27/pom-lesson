name: 课程检查
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r "04-项目实践/01-TaskFlow校园任务助手/第四版-Django网页应用/requirements.txt"
      - run: python "工具脚本/验证课程.py" --django-python python
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 在兼容目录验证Flutter起步工程
        run: python "工具脚本/验证Flutter起步工程.py"
