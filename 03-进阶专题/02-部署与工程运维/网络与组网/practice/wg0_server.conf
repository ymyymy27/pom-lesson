# 示例：服务器 /etc/wireguard/wg0.conf
# 使用前替换密钥，并把每个客户端的 PublicKey / AllowedIPs 改成真实值

[Interface]
PrivateKey = <服务器私钥>
Address = 10.66.66.1/24
ListenPort = 51820
SaveConfig = true

# 客户端 1
[Peer]
PublicKey = <客户端1公钥>
AllowedIPs = 10.66.66.2/32

# 客户端 2
[Peer]
PublicKey = <客户端2公钥>
AllowedIPs = 10.66.66.3/32
