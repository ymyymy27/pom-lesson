# vLLM Docker 部署示例（需 NVIDIA GPU + nvidia-container-toolkit）
#
# 启动: docker compose up -d
# 测试: curl http://localhost:8000/health
#
# 环境变量（可选）:
#   VLLM_API_KEY=your-secret-key

services:
  vllm:
    image: vllm/vllm-openai:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - hf_cache:/root/.cache/huggingface
    environment:
      - HF_HOME=/root/.cache/huggingface
      - VLLM_LOGGING_LEVEL=INFO
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    command: >
      --model Qwen/Qwen2.5-7B-Instruct
      --dtype auto
      --max-model-len 4096
      --gpu-memory-utilization 0.9
      --max-num-seqs 128
      --enable-prefix-caching
      --served-model-name qwen-7b
      --api-key ${VLLM_API_KEY:-changeme}

volumes:
  hf_cache:
