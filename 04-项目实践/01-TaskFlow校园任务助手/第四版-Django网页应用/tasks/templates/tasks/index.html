<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskFlow 校园任务助手</title>
<style>body{font:18px/1.6 system-ui;max-width:760px;margin:48px auto;padding:0 24px;background:#f5f7fb;color:#1b2b42}h1{line-height:1.2}input,button{font:inherit;padding:8px}button{cursor:pointer;margin-left:8px}li{padding:12px;background:white;margin:10px 0;list-style:none}ul{padding:0}.done{text-decoration:line-through;color:#697586}#status{min-height:28px;color:#8b301a}</style></head>
<body><h1>TaskFlow 校园任务助手</h1><p>把学习任务拆小，记录每一次完成。</p><form id="form">{% csrf_token %}<label for="title">新任务</label><input id="title" maxlength="120" required autocomplete="off"><button>添加</button></form><p id="status" role="status" aria-live="polite"></p><ul id="tasks"></ul>
<script>
const status=document.querySelector('#status'), list=document.querySelector('#tasks');
async function request(url, method='GET', body) {
  const token=document.querySelector('[name=csrfmiddlewaretoken]').value;
  const response=await fetch(url,{method,headers:{'Content-Type':'application/json','X-CSRFToken':token},body:body===undefined?undefined:JSON.stringify(body)});
  const data=await response.json(); if(!response.ok) throw new Error(data.error||'请求失败'); return data;
}
async function refresh(){ const data=await request('/tasks'); list.replaceChildren();
  for(const task of data.tasks){ const item=document.createElement('li'), label=document.createElement('span');label.textContent=task.title;label.className=task.done?'done':'';item.append(label);
    for(const [text,method,body] of [[task.done?'恢复':'完成','PATCH',{done:!task.done}],['删除','DELETE',undefined]]){
      const button=document.createElement('button');button.type='button';button.textContent=text;button.setAttribute('aria-label',text+'任务：'+task.title);button.onclick=async()=>{try{await request('/tasks/'+task.id,method,body);await refresh();status.textContent='已更新';}catch(e){status.textContent=e.message;}};item.append(button);
    }list.append(item);
  }if(!data.tasks.length)list.textContent='暂无任务，先添加一项吧。';
}
document.querySelector('#form').onsubmit=async(event)=>{event.preventDefault();try{await request('/tasks','POST',{title:document.querySelector('#title').value});document.querySelector('#title').value='';await refresh();status.textContent='任务已添加';}catch(e){status.textContent=e.message;}};
refresh().catch(e=>status.textContent=e.message);
</script></body></html>
